<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg" cx="30%" cy="40%" r="85%">
      <stop offset="0%" stop-color="#171310"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a7220"/>
      <stop offset="45%" stop-color="#f5c542"/>
      <stop offset="70%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a7220"/>
    </linearGradient>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" filter="url(#noise)" opacity="0.5"/>

  <!-- gold rings accent -->
  <circle cx="990" cy="120" r="110" fill="none" stroke="#d4af37" stroke-opacity="0.18" stroke-width="2"/>
  <circle cx="990" cy="120" r="78" fill="none" stroke="#d4af37" stroke-opacity="0.4" stroke-width="2.5"/>
  <g transform="translate(990 120)" filter="url(#glow)">
    <path d="M 0 -46 a 46 46 0 1 0 0.1 0 a 36 46 0 1 1 -0.1 0 Z" fill="url(#gold)"/>
  </g>

  <!-- brand mark -->
  <text x="86" y="118" font-family="'Space Grotesk','Microsoft JhengHei',sans-serif"
        font-size="26" letter-spacing="8" fill="#d4af37">NOIR GOLD ®</text>
  <line x1="86" y1="148" x2="420" y2="148" stroke="#d4af37" stroke-opacity="0.4" stroke-width="2"/>

  <!-- headline -->
  <g font-family="'Archivo Black','Noto Sans TC',sans-serif">
    <text x="86" y="278" font-size="102" font-weight="900" fill="#f5f0e6" letter-spacing="2">MAKE THEM</text>
    <text x="86" y="372" font-size="102" font-weight="900" fill="none" stroke="#d4af37" stroke-width="2.5" letter-spacing="2">STOP</text>
    <text x="86" y="466" font-size="102" font-weight="900" fill="url(#gold)" letter-spacing="2">SCROLLING.</text>
  </g>

  <!-- sub -->
  <text x="86" y="532" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif"
        font-size="26" fill="rgba(245,240,230,0.7)" letter-spacing="2">汪華 · 視覺創意 × 社群行銷 作品集</text>

  <!-- bottom bar -->
  <line x1="86" y1="572" x2="1114" y2="572" stroke="#d4af37" stroke-opacity="0.35" stroke-width="1.5"/>
  <text x="86" y="602" font-family="'Space Grotesk','Microsoft JhengHei',sans-serif"
        font-size="18" letter-spacing="6" fill="#8a7220">視覺創意 · 社群美感 · 品牌美學 · Campaign 視覺</text>
  <text x="1114" y="602" font-family="'Space Grotesk','Microsoft JhengHei',sans-serif"
        font-size="18" letter-spacing="4" fill="#8a7220" text-anchor="end">oniontest0-dot.github.io</text>

  <!-- corner marks -->
  <g stroke="#d4af37" stroke-opacity="0.7" stroke-width="3" stroke-linecap="round">
    <path d="M 1140 60 L 1160 60 L 1160 80"/>
    <path d="M 40 60 L 60 60 L 60 80"/>
  </g>
</svg>
